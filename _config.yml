# Site settings
title: 周睿的中文博客 | Rui Zhou
description: 个人随笔、科研心得与生活攻略
url: "https://ruizhou03.com"
baseurl: ""

author:
  name: 周睿 (Rui Zhou)
  email: ruizhou@psu.edu

# 分享卡片（微信/朋友圈/Twitter/通用 OG）的默认封面
# 文章 front-matter 没写 image/cover 时回退到这张
default_share_image: /assets/share/share-default.png

# 站主(作者)的账号 accountId：评论区据此给站主评论打「作者」徽章（评论网址锁成 /u/?id=<此值>）
comment_author_id: "a_mpw2mdbs6e2qrc44"

# Build settings
markdown: kramdown

# Plugins (GitHub Pages supported)
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-redirect-from

# Exclude from build
exclude:
  - README.md
  - CLAUDE.md
  - Gemfile
  - Gemfile.lock
  - vendor/
  - .gitignore
  # 内部文档（DAILY_REVIEW / EMAIL_SUMMARY 是 routine 自动更新目标，保留根路径触发 workflow）
  - docs/
  - DAILY_REVIEW.md
  - EMAIL_SUMMARY.md
  - EMAIL_SUMMARY.html
  - SECURITY_GOVERNANCE.md
  - SPOTCHECK_100_REPORT.md
  - SPOTCHECK_100_AGENT_REPORTS.md
  - TOOLBOX_AUDIT_REPORT.md
  - "*.log"
  - .claude/
  - .githooks/
  - scripts/
  - tools/
  # 播客流水线：参考音 / 生成的 mp3 / 播客稿，都不进 Jekyll 构建
  - audio/
  # 本地保留但不公开的版权审查归档；旧站点路径必须真实 404
  - files/_archive/
  # 学习资料长期退出公开站：保留源文件与现有目录结构，但不生成页面、索引或附件。
