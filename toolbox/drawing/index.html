<style>

  .dg-app{width:100%;min-height:100dvh;padding:10px}

  .dg-exit{padding:0;display:grid;place-items:center;border:1px solid var(--dg-line);color:var(--dg-muted);background:rgba(255,255,255,.48);text-decoration:none}.dg-exit span:last-child{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}.dg-exit .dgi{width:19px;height:19px}

  .dg-top-action{padding:0;display:grid;place-items:center;border:1px solid var(--dg-line);color:var(--dg-muted);background:rgba(255,255,255,.48);cursor:pointer}.dg-top-action .dgi{width:18px;height:18px}@keyframes dg-pulse{to{opacity:.35}}

  .dg-section-head>span{color:var(--dg-accent);font:600 .68rem/1 var(--dg-latin);letter-spacing:.15em}.dg-section-head h2{margin:7px 0 4px;color:var(--dg-ink);font:600 clamp(1.45rem,2.3vw,2rem)/1.15 var(--dg-font)}.dg-section-head p{margin:0;color:var(--dg-muted);font-size:.78rem;line-height:1.55}.dg-lobby-note{color:var(--dg-muted);font-size:.72rem;line-height:1.55}

  /* A 纸艺工作室入口：只用局部功能岛，背景完整环绕。 */
  .dg-entry{min-height:100%;display:grid;place-items:center}.dg-entry-rail{display:none}
  .dg-entry-main{width:min(920px,100%);padding:clamp(24px,3.5vw,42px);border:1px solid var(--dg-line);border-radius:22px;background:var(--dg-panel-strong);backdrop-filter:blur(11px) saturate(102%);box-shadow:0 22px 65px rgba(67,55,43,.16)}
  .dg-entry-actions{margin-top:24px;display:grid;grid-template-columns:1fr 1fr;gap:12px}.dg-entry-action{min-height:132px;padding:18px;display:grid;grid-template-columns:48px minmax(0,1fr);gap:14px;align-content:center;text-align:left;border:1px solid var(--dg-line);border-radius:16px;color:var(--dg-ink);background:rgba(255,255,255,.58);cursor:pointer}
  .dg-entry-action .action-icon{width:48px;height:48px;display:grid;place-items:center;border-radius:14px;color:var(--dg-accent);background:var(--dg-accent-soft)}.dg-entry-action.join .action-icon{color:var(--dg-teal);background:rgba(198,219,214,.62)}.dg-entry-action .dgi{width:28px;height:28px}

  .dg-create-wizard{width:min(1000px,100%);min-height:100%;margin:auto;display:grid;grid-template-columns:215px minmax(0,1fr);overflow:hidden;border:1px solid var(--dg-line);border-radius:22px;background:var(--dg-panel-strong);backdrop-filter:blur(11px) saturate(102%);box-shadow:0 22px 65px rgba(67,55,43,.16)}
  .dg-create-rail{padding:24px 16px;border-right:1px solid var(--dg-line);background:rgba(244,221,210,.22)}.dg-create-rail h2{margin:7px 0 19px;color:var(--dg-ink);font:600 1.05rem/1.25 var(--dg-font)}

  .dg-create-summary{margin-top:24px;padding:13px;border:1px solid var(--dg-line);border-radius:13px;background:rgba(255,255,255,.38)}.dg-create-summary span{color:var(--dg-muted);font-size:.65rem}.dg-create-summary strong{display:block;margin:5px 0;color:var(--dg-ink);font-size:1rem}.dg-create-summary small{color:var(--dg-accent);font-size:.66rem}
  .dg-create-main{min-width:0;padding:clamp(22px,3vw,34px)}.dg-create-main .dg-section-head{margin-bottom:18px}.dg-form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.dg-field.full{grid-column:1/-1}.dg-field-card{min-width:0;padding:12px 13px;border:1px solid var(--dg-line);border-radius:14px;background:rgba(255,255,255,.48)}.dg-field-card .dg-input,.dg-field-card .dg-select{min-height:46px}
  .dg-form-grid>.dg-field-card:nth-child(3){grid-column:1/-1;margin-top:8px;position:relative}.dg-form-grid>.dg-field-card:nth-child(3)::before{content:"";position:absolute;left:0;right:0;top:-11px;height:1px;background:var(--dg-line)}
  .dg-form-actions{margin-top:18px;padding-top:14px;display:flex;justify-content:flex-end;gap:9px;border-top:1px solid var(--dg-line)}

  .dg-join-shell{min-height:100%;display:grid;place-items:center}.dg-join-card{width:min(860px,100%);padding:clamp(24px,3.5vw,38px);border:1px solid var(--dg-line);border-radius:22px;background:var(--dg-panel-strong);backdrop-filter:blur(11px) saturate(102%);box-shadow:0 22px 65px rgba(67,55,43,.16)}
  .dg-join-heading{display:grid;grid-template-columns:62px minmax(0,1fr);gap:15px;align-items:center;margin-bottom:22px}.dg-join-emblem{width:62px;height:62px;display:grid;place-items:center;border-radius:18px;color:var(--dg-teal);background:rgba(198,219,214,.55)}.dg-join-emblem .dgi{width:35px;height:35px}.dg-join-heading h2{margin:5px 0 3px;color:var(--dg-ink);font:600 1.55rem/1.2 var(--dg-font)}.dg-join-heading p{margin:0;color:var(--dg-muted);font-size:.76rem}
  .dg-join-fields{padding:18px;display:grid;grid-template-columns:1fr 1fr;gap:16px;border:1px solid var(--dg-line);border-radius:16px;background:rgba(255,255,255,.43)}.dg-room-code-input{font-family:var(--dg-latin);font-size:1.35rem;letter-spacing:.18em;font-variant-numeric:tabular-nums}
  .dg-code-cells,.dg-room-code-cells{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.dg-code-cell{width:100%;min-width:0;height:60px;padding:0;border:1px solid var(--dg-line);border-radius:12px;color:var(--dg-ink);background:#fff;font:600 1.7rem/1 var(--dg-latin);text-align:center}

  /* 大厅：真实玩家后面只跟一个动态等待点。 */
  .dg-lobby{min-height:100%;height:100%;padding:18px;display:grid;grid-template-rows:auto auto minmax(0,1fr) auto;border:1px solid var(--dg-line);border-radius:18px;background:var(--dg-panel);backdrop-filter:blur(11px) saturate(102%);box-shadow:0 10px 28px rgba(67,55,43,.09)}
  .dg-lobby-head{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:12px}.dg-room-ticket{min-height:118px;padding:20px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:18px;align-items:center;border:1px solid var(--dg-line-hi);border-radius:16px;background:linear-gradient(135deg,rgba(255,248,237,.82),rgba(244,221,210,.56))}
  .dg-room-ticket .label{color:var(--dg-muted);font:600 .68rem/1 var(--dg-latin);letter-spacing:.16em}.dg-room-ticket .code{margin-top:7px;color:var(--dg-ink);font:600 clamp(2.8rem,5vw,4.3rem)/.9 var(--dg-latin);letter-spacing:.15em}.dg-ticket-actions{display:flex;align-items:center;flex-wrap:wrap;justify-content:flex-end;gap:8px}
  .dg-player-section{min-height:0;margin-top:12px;padding:15px;overflow:auto;border:1px solid var(--dg-line);border-radius:16px;background:rgba(255,255,255,.38)}.dg-player-section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}.dg-player-section-head h3{margin:0;color:var(--dg-ink);font:600 1rem/1.25 var(--dg-font)}
  .dg-player-list{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}.dg-player{min-height:66px;padding:10px;display:grid;grid-template-columns:38px minmax(0,1fr) auto;gap:9px;align-items:center;border:1px solid var(--dg-line);border-radius:13px;background:rgba(255,255,255,.53)}.dg-player.me{border-color:rgba(77,125,124,.38)}.dg-player.offline{opacity:.5}

  .dg-player .kick{min-width:38px;height:34px;border:1px solid rgba(189,109,79,.22);border-radius:9px;color:var(--dg-accent);background:rgba(255,245,240,.58);cursor:pointer;font-size:.62rem}
  .dg-waiting-seat,.dg-player.waiting{color:var(--dg-muted);background:rgba(255,255,255,.35)}.dg-waiting-dots{display:flex;align-items:center;gap:4px}.dg-waiting-dots i{width:6px;height:6px;border-radius:50%;background:var(--dg-accent);animation:dg-dot 1.2s infinite ease-in-out}.dg-waiting-dots i:nth-child(2){animation-delay:.16s}.dg-waiting-dots i:nth-child(3){animation-delay:.32s}@keyframes dg-dot{0%,70%,100%{opacity:.22;transform:translateY(0)}35%{opacity:1;transform:translateY(-4px)}}.dg-lobby-start{margin-top:12px;display:flex;align-items:center;justify-content:flex-end;gap:9px}

  /* 游戏：画布吃满左侧全部剩余空间。 */
  .dg-game{min-height:100%;height:100%;display:grid;grid-template-rows:auto auto minmax(0,1fr);gap:10px}.dg-game-command{min-height:46px;padding:5px 7px 5px 11px;display:flex;align-items:center;justify-content:space-between;gap:10px;border:1px solid var(--dg-line);border-radius:14px;background:var(--dg-panel);backdrop-filter:blur(11px);box-shadow:0 10px 28px rgba(67,55,43,.08)}.dg-room-meta{color:var(--dg-muted);font:600 .7rem/1 var(--dg-latin);letter-spacing:.1em;white-space:nowrap}
  .dg-topbar{min-height:44px;padding:5px 11px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;border:1px solid var(--dg-line);border-radius:14px;background:var(--dg-card-soft);backdrop-filter:blur(11px);box-shadow:0 10px 28px rgba(67,55,43,.08)}.dg-topbar .round-pill{color:var(--dg-accent);font-size:.72rem;font-weight:700}.dg-topbar .word-display{text-align:center;color:var(--dg-ink);font-size:1.08rem;font-weight:700;letter-spacing:.18em}.dg-topbar .word-display.drawer-word{color:var(--dg-accent);letter-spacing:.03em}

  .dg-canvas-column{min-width:0;min-height:0;display:grid;grid-template-rows:minmax(0,1fr) auto;gap:10px}.dg-canvas-wrap{position:relative;min-width:0;min-height:0;height:100%;overflow:hidden;border:1px solid rgba(105,91,73,.17);border-radius:17px;background:#fffdf9;touch-action:none;box-shadow:inset 0 0 45px rgba(110,89,65,.035),0 12px 32px rgba(78,63,48,.08)}.dg-canvas{display:block;width:100%;height:100%;background:#fffdf9;cursor:crosshair}.dg-canvas.readonly{cursor:default}
  .dg-canvas-overlay{position:absolute;inset:0;z-index:5;padding:20px;display:grid;place-items:center;color:var(--dg-ink);background:rgba(255,253,249,.91)}.dg-canvas-overlay.reveal,.dg-canvas-overlay.is-reveal{place-items:end center;background:linear-gradient(180deg,rgba(255,253,249,0) 28%,rgba(255,253,249,.3) 58%,rgba(255,253,249,.86))}.dg-canvas-overlay .panel{width:min(700px,94%);text-align:center}.dg-canvas-overlay h2{margin:0 0 9px;color:var(--dg-ink);font:600 1.65rem/1.2 var(--dg-font)}
  .dg-canvas-overlay .word-choices{margin-top:18px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.dg-canvas-overlay .word-choices button{min-height:82px;padding:12px;border:1px solid rgba(189,109,79,.3);border-radius:14px;color:var(--dg-ink);background:#fffaf3;cursor:pointer;font:600 1.08rem/1.2 var(--dg-font)}.dg-canvas-overlay .reveal-word{margin:9px 0;color:var(--dg-accent);font:600 2.15rem/1.1 var(--dg-font)}.dg-canvas-overlay .reveal-meta{display:none}
  .dg-pick-timer,.dg-choice-timer{width:70px;height:70px;margin:0 auto 14px;display:grid;place-items:center;border:5px solid rgba(189,109,79,.2);border-top-color:var(--dg-accent);border-radius:50%;color:var(--dg-accent);background:#fffaf3;font:600 1.8rem/1 var(--dg-latin);box-shadow:0 0 0 7px rgba(189,109,79,.06)}.dg-pick-timer.danger,.dg-choice-timer.danger,.dg-pick-timer.critical{animation:dg-breathe 1s ease-in-out infinite}
