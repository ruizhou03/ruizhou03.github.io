---
layout: default
title: "猫咪档案 | 百变小咪"
permalink: /toolbox/puffcat/me/
sitemap: false
body_class: zmme-page
---
<!-- 百变小咪 · 猫咪档案（2026-11-22 用户挑丙：可视化、少文字）。数据来自 zircon-urge /api/zmw?action=profile（见 assets/js/games/zhamao-wallet.js）。
     没登录也能看（这台设备的游客钱包）；登录后游客攒的小鱼干自动并进账号，手机 / 平板登同一个账号都记在一起 -->
<style>
body.zmme-page main{max-width:880px}
.zmme{--paper:#f3eee3;--card:#fffdf8;--wash:#ebe5d8;--ink:#1d1b18;--mute:#6a6358;--faint:#d9cfbd;--seal:#b4392c;--gold:#e3a83f;--good:#3f7a52;
  color:var(--ink);font:15px/1.5 -apple-system,"PingFang SC","Noto Sans SC",system-ui,sans-serif;margin:8px 0 40px}
.zmme *{box-sizing:border-box;min-width:0}
.zmme-top{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.zmme-back{display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:50%;border:1.5px solid var(--ink);color:var(--ink);background:var(--card);text-decoration:none;flex:none}
.zmme-back svg{width:18px;height:18px}
.zmme-top h1{margin:0;font:900 clamp(24px,4vw,30px)/1.1 "Noto Serif SC",serif}
.zmme-card{background:var(--card);border:1.5px solid var(--ink);border-radius:20px;padding:16px;box-shadow:0 3px 0 var(--ink)}
.zmme-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:14px}
.zmme-grid .wide{grid-column:1/-1}
@media(max-width:640px){.zmme-grid{grid-template-columns:minmax(0,1fr)}}
.zmme-hero{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;background:var(--paper)}
.zmme-av{width:64px;height:64px;border-radius:50%;overflow:hidden;border:2px solid var(--ink);background:var(--wash);display:grid;place-items:center;font:900 24px "Noto Serif SC",serif}
.zmme-av svg{width:100%;height:100%;display:block}
.zmme-nick{font:900 20px/1.2 "Noto Serif SC",serif}
.zmme-who{display:flex;align-items:center;gap:8px;margin-top:4px;color:var(--mute);font-size:13px}
.zmme-who .ok{display:inline-flex;width:18px;height:18px;border-radius:50%;background:var(--good);align-items:center;justify-content:center}
.zmme-who .ok svg{width:11px;height:11px}
.zmme-login{border:1.5px solid var(--seal);color:var(--seal);background:var(--card);border-radius:999px;padding:6px 14px;font:600 14px/1 system-ui;cursor:pointer}
.zmme-bal{text-align:right}
.zmme-bal .n{display:inline-flex;align-items:center;gap:8px;font:900 clamp(30px,6vw,44px)/1 Georgia,"Noto Serif SC",serif;font-variant-numeric:tabular-nums}
.zmme-bal .zmw-fish{width:48px;height:30px}
.zmme-bal .sub{display:flex;gap:10px;justify-content:flex-end;margin-top:6px;font:600 13px/1 Georgia,serif;color:var(--mute)}
.zmme-bal .sub .up{color:var(--good)}.zmme-bal .sub .dn{color:var(--seal)}
@media(max-width:520px){.zmme-hero{grid-template-columns:auto minmax(0,1fr)}.zmme-bal{grid-column:1/-1;text-align:left}.zmme-bal .sub{justify-content:flex-start}}
.zmme-h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 0 10px;font:700 15px/1.2 "Noto Serif SC",serif}
.zmme-h small{font:500 12px system-ui;color:var(--mute)}
.zmme-week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.zmme-day{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0 7px;border:1.5px solid var(--faint);border-radius:14px;background:var(--paper);font:700 13px/1 Georgia,serif;color:var(--mute)}
.zmme-day .zmw-fish{width:26px;height:16px;opacity:.35}
.zmme-day.is-done{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.zmme-day.is-done .zmw-fish{opacity:1}
.zmme-day.is-now{border-color:var(--seal);color:var(--seal);background:var(--card);cursor:pointer;box-shadow:0 0 0 3px rgba(180,57,44,.18)}
.zmme-day.is-now .zmw-fish{opacity:1}
.zmme-day.is-big{background-image:radial-gradient(circle at 50% 30%,rgba(227,168,63,.28),transparent 70%)}
@media(prefers-reduced-motion:no-preference){.zmme-day.is-now{animation:zmmePulse 1.6s ease-in-out infinite}@keyframes zmmePulse{50%{box-shadow:0 0 0 7px rgba(180,57,44,.08)}}}
.zmme-spark{position:relative;height:120px}
.zmme-spark svg{position:absolute;inset:0;width:100%;height:100%}
.zmme-heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,minmax(0,1fr));gap:3px}
.zmme-heat i{aspect-ratio:1;border-radius:3px;background:var(--wash)}
.zmme-heat i.l1{background:#f0c9bb}.zmme-heat i.l2{background:#dc8b76}.zmme-heat i.l3{background:#c4553f}.zmme-heat i.l4{background:var(--seal)}
.zmme-heat i.fut{background:transparent}
.zmme-rings{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;text-align:center}
.zmme-ring svg{width:100%;max-width:92px;height:auto}
.zmme-ring b{display:block;font:700 14px/1.2 "Noto Serif SC",serif}
.zmme-ring small{color:var(--mute);font:600 12px Georgia,serif}
.zmme-bars{display:grid;gap:10px}
.zmme-bar{display:grid;grid-template-columns:3em minmax(0,1fr) 3.4em;gap:8px;align-items:center;font-size:14px}
.zmme-bar .t{height:14px;border-radius:7px;background:var(--wash);overflow:hidden}
.zmme-bar .t i{display:block;height:100%;border-radius:7px;background:var(--ink)}
.zmme-bar span:last-child{text-align:right;font:700 14px Georgia,serif;font-variant-numeric:tabular-nums}
.zmme-recs{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px}
.zmme-rec{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 4px 7px;border-radius:14px;background:var(--paper);border:1.5px solid var(--faint)}
.zmme-rec .m{position:absolute;top:6px;left:6px;width:8px;height:8px;border-radius:50%}
.zmme-rec .rk{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font:700 14px/1 Georgia,serif;background:var(--wash);color:var(--mute)}
.zmme-rec .rk.g1{background:#e9c46a;color:#6b4a12}.zmme-rec .rk.g2{background:#cfd3d9;color:#4b5058}.zmme-rec .rk.g3{background:#d9a477;color:#5e3517}
.zmme-rec .rk svg{width:18px;height:18px}
.zmme-rec .d{font:700 13px/1 Georgia,serif;font-variant-numeric:tabular-nums}
.zmme-rec .d.up{color:var(--good)}.zmme-rec .d.dn{color:var(--seal)}
.zmme-rec .nn{font:600 11px/1 system-ui;color:var(--mute)}
.zmme-badges{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;text-align:center}
@media(max-width:520px){.zmme-badges{grid-template-columns:repeat(3,minmax(0,1fr))}}
.zmme-badge svg{width:52px;height:52px}
.zmme-badge small{display:block;font:600 12px/1.25 system-ui;color:var(--mute);margin-top:2px}
.zmme-badge.off svg{filter:grayscale(1);opacity:.28}
.zmme-legend{display:flex;gap:12px;flex-wrap:wrap;margin-top:8px;font-size:12px;color:var(--mute)}
.zmme-legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px;vertical-align:0}
.zmme details{margin-top:14px}
.zmme summary{cursor:pointer;font:700 15px "Noto Serif SC",serif;padding:6px 0;list-style-position:inside}
.zmme-led{list-style:none;margin:6px 0 0;padding:0}
.zmme-led li{display:grid;grid-template-columns:28px minmax(0,1fr) auto auto;gap:8px;align-items:center;padding:7px 0;border-bottom:1px dashed var(--faint);font-size:14px}
.zmme-led .ic{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--wash)}
.zmme-led .ic svg{width:15px;height:15px}
.zmme-led time{color:var(--mute);font-size:12px;white-space:nowrap}
.zmme-led b{font:700 14px Georgia,serif;font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right;min-width:3.5em}
.zmme-led b.up{color:var(--good)}.zmme-led b.dn{color:var(--seal)}
.zmme-empty{color:var(--mute);font-size:14px;text-align:center;padding:10px 0}
.zmme-err{color:var(--seal);text-align:center;padding:30px 0}
</style>

<div class="zmme" id="zmme">
  <div class="zmme-top">
    <a class="zmme-back" href="/toolbox/puffcat/" aria-label="回到百变小咪"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></a>
    <h1>猫咪档案</h1>
  </div>
  <div id="zmmeBody"><div class="zmme-card zmme-empty">…</div></div>
</div>

<script src="/assets/js/games/gongzhu-avatars.js?v={{ site.time | date: '%s' }}"></script>
<script src="/assets/js/games/zhamao-wallet.js?v={{ site.time | date: '%s' }}"></script>
<script>
{
  const W = window.ZhamaoWallet, AV = window.GongzhuAvatars || null;
  const $ = (id) => document.getElementById(id);
  const esc = (t) => String(t == null ? '' : t).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
  const fmt = (x) => Math.round(Math.abs(x || 0)).toLocaleString('en-US');
  const sign = (x) => (x > 0 ? '+' : x < 0 ? '−' : '') + fmt(x);
  const MODES = [['classic', '经典', '#c8463a'], ['flux', '百变', '#8e4a9c'], ['team', '组队', '#2f4a6d'], ['roles', '角色', '#e58e46']];
  const MODE_C = Object.fromEntries(MODES.map(([k, , c]) => [k, c]));
  const TIERS = [['easy', '入门'], ['normal', '普通'], ['hard', '高手']];
  const FISH = W ? W.FISH : '';
  const CROWN = '<svg viewBox="0 0 24 24"><path d="M3 18 4.5 7l5 5L12 5l2.5 7 5-5L21 18Z" fill="#6b4a12"/></svg>';
  const TICK = '<svg viewBox="0 0 16 16"><path d="M3 8.5 6.5 12 13 4.5" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  const IC = {
    newbie: '<svg viewBox="0 0 24 24"><rect x="4" y="9" width="16" height="11" rx="2" fill="#e3a83f" stroke="#1d1b18" stroke-width="1.5"/><path d="M12 9v11M4 13h16" stroke="#1d1b18" stroke-width="1.5"/><path d="M12 9c-3-4-7-2-4 0M12 9c3-4 7-2 4 0" fill="none" stroke="#b4392c" stroke-width="1.6"/></svg>',
    checkin: '<svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="3" fill="#fffdf8" stroke="#1d1b18" stroke-width="1.5"/><path d="M4 10h16M9 3v4M15 3v4" stroke="#1d1b18" stroke-width="1.5"/><path d="M9 15l2 2 4-4" fill="none" stroke="#3f7a52" stroke-width="1.8"/></svg>',
    ticket: '<svg viewBox="0 0 24 24"><path d="M3 8a2 2 0 0 0 2-2h14a2 2 0 0 0 2 2v8a2 2 0 0 0-2 2H5a2 2 0 0 0-2-2Z" fill="#f0c9bb" stroke="#1d1b18" stroke-width="1.5"/><path d="M14 6v12" stroke="#1d1b18" stroke-dasharray="2 2"/></svg>',
    win: '<svg viewBox="0 0 24 24"><path d="M7 4h10v4a5 5 0 0 1-10 0Z" fill="#e9c46a" stroke="#1d1b18" stroke-width="1.5"/><path d="M12 13v4M8 20h8" stroke="#1d1b18" stroke-width="1.5"/></svg>',
    star: '<svg viewBox="0 0 24 24"><path d="M12 3l2.6 5.6 6 .7-4.5 4.2 1.2 6L12 16.6l-5.3 2.9 1.2-6L3.4 9.3l6-.7Z" fill="#e9b949" stroke="#b07420" stroke-width="1.3"/></svg>',
    relief: '<svg viewBox="0 0 24 24"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10Z" fill="#dc8b76" stroke="#1d1b18" stroke-width="1.5"/></svg>',
    feedback: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8" fill="#fffdf8" stroke="#1d1b18" stroke-width="1.5"/><path d="M9 10h.01M15 10h.01M9 15.5c2-1.4 4-1.4 6 0" stroke="#1d1b18" stroke-width="1.8" stroke-linecap="round"/></svg>',
    merge: '<svg viewBox="0 0 24 24"><path d="M6 4v6a6 6 0 0 0 6 6h6M14 12l4 4-4 4" fill="none" stroke="#1d1b18" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  };
  const LED = { newbie: 'newbie', checkin: 'checkin', ticket: 'ticket', win: 'win', online: 'win', firstwin: 'star', broke1: 'relief', relief: 'relief', feedback: 'feedback', merge: 'merge', merged: 'merge', opened: 'merge' };
  const LED_NAME = { newbie: '新手礼包', checkin: '签到', ticket: '门票', win: '名次奖励', online: '联机奖励', firstwin: '今日首胜', broke1: '第一次亏空', relief: '救济', feedback: '这步不对', merge: '游客小鱼干并入', merged: '并入账号', opened: '账号钱包' };

  function myFace() {
    let p = null; try { p = JSON.parse(localStorage.getItem('zm.profile.v1')); } catch (_) { /* */ }
    const u = window.SiteAuth && SiteAuth.getUser ? SiteAuth.getUser() : null;
    const nick = (p && p.nick) || (u && u.nick) || '我';
    const svg = p && p.avatar && AV && AV.byId[p.avatar] ? AV.byId[p.avatar].svg : '';
    return { nick, face: svg || esc(nick.slice(0, 1)) };
  }

  function ring(w, g, color) {
    const r = 30, c = 2 * Math.PI * r, k = g ? w / g : 0;
    return '<svg viewBox="0 0 80 80" role="img" aria-label="胜率 ' + Math.round(k * 100) + '%"><circle cx="40" cy="40" r="' + r + '" fill="none" stroke="#ebe5d8" stroke-width="10"/>' +
      (g ? '<circle cx="40" cy="40" r="' + r + '" fill="none" stroke="' + color + '" stroke-width="10" stroke-linecap="round" stroke-dasharray="' + (c * k).toFixed(1) + ' ' + c.toFixed(1) + '" transform="rotate(-90 40 40)"/>' : '') +
      '<text x="40" y="45" text-anchor="middle" font-family="Georgia,serif" font-size="16" font-weight="700" fill="#1d1b18">' + (g ? Math.round(k * 100) + '%' : '–') + '</text></svg>';
  }

  function heatHtml(heat) {
    const days = 26 * 7, now = new Date(Date.now() + 8 * 3600e3), dow = now.getUTCDay();
    const start = Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate()) - (days - 7 + dow) * 86400e3;
    let out = '';
    for (let i = 0; i < 26 * 7; i++) {
      const t = start + i * 86400e3, d = new Date(t).toISOString().slice(0, 10), n = heat[d] || 0;
      const fut = t > Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate());
      out += '<i class="' + (fut ? 'fut' : n >= 12 ? 'l4' : n >= 6 ? 'l3' : n >= 3 ? 'l2' : n ? 'l1' : '') + '" title="' + d + ' · ' + n + ' 局"></i>';
    }
    return out;
  }

  function sparkSvg(ledger, W0, H) {
    const pts = ledger.slice().reverse().map((x) => Number(x.bal) || 0);
    if (pts.length < 2) return '';
    const max = Math.max(...pts, 1), min = Math.min(...pts, 0), pad = 8, w = W0 - pad * 2, h = H - pad * 2 - 14;
    const X = (i) => pad + (i / (pts.length - 1)) * w, Y = (v) => pad + h - ((v - min) / (max - min || 1)) * h;
    const line = pts.map((v, i) => (i ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(v).toFixed(1)).join('');
    const last = pts[pts.length - 1];
    return '<svg viewBox="0 0 ' + W0 + ' ' + H + '"><defs><linearGradient id="zmmeG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e3a83f" stop-opacity=".45"/><stop offset="1" stop-color="#e3a83f" stop-opacity="0"/></linearGradient></defs>' +
      '<path d="' + line + 'L' + X(pts.length - 1).toFixed(1) + ' ' + (pad + h) + 'L' + pad + ' ' + (pad + h) + 'Z" fill="url(#zmmeG)"/>' +
      '<path d="' + line + '" fill="none" stroke="#1d1b18" stroke-width="2.2" stroke-linejoin="round"/>' +
      '<circle cx="' + X(pts.length - 1).toFixed(1) + '" cy="' + Y(last).toFixed(1) + '" r="4.5" fill="#b4392c"/>' +
      '<text x="' + pad + '" y="' + (H - 4) + '" font-size="12" fill="#6a6358" font-family="Georgia,serif">' + fmt(pts[0]) + '</text>' +
      '<text x="' + (W0 - pad) + '" y="' + (H - 4) + '" font-size="12" fill="#6a6358" text-anchor="end" font-family="Georgia,serif">' + fmt(last) + '</text></svg>';
  }

  const BADGES = [
    ['七连签', (p) => p.checkin.best >= 7, '#3f7a52', '<path d="M32 12l5 11 12 1-9 8 3 12-11-6-11 6 3-12-9-8 12-1Z"/>'],
    ['捉虫十只', (p) => p.fbTotal >= 10, '#2f4a6d', '<ellipse cx="32" cy="36" rx="10" ry="13"/><path d="M32 23v26M22 30l-7-4M42 30l7-4M22 40l-7 3M42 40l7 3M27 20l-4-6M37 20l4-6" stroke="#fffdf8" stroke-width="3" fill="none" stroke-linecap="round"/>'],
    ['高手十胜', (p) => p.tiers.hard.w >= 10, '#c8463a', '<path d="M18 44l3-22 8 9 3-12 3 12 8-9 3 22Z"/>'],
    ['百局老猫', (p) => Object.values(p.modes).reduce((a, m) => a + m.g, 0) >= 100, '#8e4a9c', '<text x="32" y="41" text-anchor="middle" font-size="20" font-weight="700" font-family="Georgia,serif" fill="#fffdf8">100</text>'],
    ['九人桌第一', (p) => p.records.some((r) => r.n === 9 && (r.rank === 1 || (r.won && r.mode === 'team'))), '#e58e46', '<text x="32" y="43" text-anchor="middle" font-size="24" font-weight="700" font-family="Georgia,serif" fill="#fffdf8">9</text>'],
    ['一局赚百鱼', (p) => p.best >= 100, '#b07420', '<path d="M14 32c6-9 17-12 26-9 4 1 7 4 9 9-2 5-5 8-9 9-9 3-20 0-26-9Z M47 32l8-7v14Z" fill="#fffdf8"/>'],
  ];
  const badgeSvg = (color, inner) => '<svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="28" fill="' + color + '" stroke="#1d1b18" stroke-width="2.5"/><g fill="#fffdf8">' + inner + '</g></svg>';

  function render(p) {
    const me = myFace(), cyc = p.checkin.cycle, k0 = p.checkin.today ? (p.checkin.streak - 1) : p.checkin.streak;
    const pos = ((k0 % 7) + 7) % 7, round0 = k0 - pos;
    const week = cyc.map((amt, i) => {
      const n = round0 + i, done = n < p.checkin.streak, now = !p.checkin.today && n === p.checkin.streak;
      return '<button type="button" class="zmme-day' + (done ? ' is-done' : '') + (now ? ' is-now' : '') + (i === 6 ? ' is-big' : '') + '"' + (now ? ' data-ck' : ' disabled') + ' aria-label="第 ' + (i + 1) + ' 天 ' + amt + '">' + FISH + amt + '</button>';
    }).join('');
    const total = Object.values(p.modes).reduce((a, m) => a + m.g, 0);
    const wk = p.records.filter((r) => Date.now() - r.at < 7 * 86400e3).reduce((a, r) => a + (r.d || 0), 0);
    const recs = p.records.slice(0, 24).map((r) => {
      const rk = r.mode === 'team' ? (r.won ? '<span class="rk g1">' + CROWN + '</span>' : '<span class="rk">–</span>') : '<span class="rk' + (r.rank <= 3 ? ' g' + r.rank : '') + '">' + r.rank + '</span>';
      return '<div class="zmme-rec" title="' + new Date(r.at).toLocaleString() + '"><i class="m" style="background:' + (MODE_C[r.mode] || '#999') + '"></i>' + rk + '<span class="d ' + (r.d > 0 ? 'up' : r.d < 0 ? 'dn' : '') + '">' + sign(r.d) + '</span><span class="nn">' + r.n + (r.src === 'online' ? ' · 联' : '') + '</span></div>';
    }).join('');
    const led = p.ledger.map((x) => '<li><span class="ic">' + (IC[LED[x.why]] || IC.ticket) + '</span><span>' + (LED_NAME[x.why] || x.why) + '</span><time>' + new Date(x.at).toLocaleDateString() + '</time><b class="' + (x.d > 0 ? 'up' : x.d < 0 ? 'dn' : '') + '">' + sign(x.d) + '</b></li>').join('');
    $('zmmeBody').innerHTML =
      '<div class="zmme-card zmme-hero"><div class="zmme-av">' + me.face + '</div><div><div class="zmme-nick">' + esc(me.nick) + '</div><div class="zmme-who">' +
        (p.owner === 'account' ? '<span class="ok">' + TICK + '</span>已登录' : '<button type="button" class="zmme-login" data-login>登录</button>') + '</div></div>' +
        '<div class="zmme-bal"><span class="n">' + FISH + '<span data-bal>' + fmt(p.bal) + '</span></span><div class="sub"><span class="' + (wk >= 0 ? 'up' : 'dn') + '">本周 ' + sign(wk) + '</span><span>' + total + ' 局</span></div></div></div>' +
      '<div class="zmme-grid">' +
        '<div class="zmme-card wide"><div class="zmme-h">签到<small>连签 ' + p.checkin.streak + ' 天</small></div><div class="zmme-week">' + week + '</div></div>' +
        '<div class="zmme-card"><div class="zmme-h">余额走势</div><div class="zmme-spark" id="zmmeSpark"></div></div>' +
        '<div class="zmme-card"><div class="zmme-h">活跃<small>近半年</small></div><div class="zmme-heat">' + heatHtml(p.heat) + '</div></div>' +
        '<div class="zmme-card"><div class="zmme-h">玩法胜率</div><div class="zmme-rings">' + MODES.map(([k, name, c]) => '<div class="zmme-ring">' + ring(p.modes[k].w, p.modes[k].g, c) + '<b>' + name + '</b><small>' + p.modes[k].g + ' 局</small></div>').join('') + '</div></div>' +
        '<div class="zmme-card"><div class="zmme-h">机器猫档位</div><div class="zmme-bars">' + TIERS.map(([k, name]) => { const t = p.tiers[k], r = t.g ? t.w / t.g : 0; return '<div class="zmme-bar"><span>' + name + '</span><span class="t"><i style="width:' + (r * 100).toFixed(1) + '%"></i></span><span>' + (t.g ? Math.round(r * 100) + '%' : '–') + '</span></div>'; }).join('') + '</div></div>' +
        '<div class="zmme-card wide"><div class="zmme-h">最近对局</div>' + (recs ? '<div class="zmme-recs">' + recs + '</div><div class="zmme-legend">' + MODES.map(([, name, c]) => '<span><i style="background:' + c + '"></i>' + name + '</span>').join('') + '</div>' : '<div class="zmme-empty">还没打过</div>') + '</div>' +
        '<div class="zmme-card wide"><div class="zmme-h">徽章</div><div class="zmme-badges">' + BADGES.map(([name, ok, c, inner]) => '<div class="zmme-badge' + (ok(p) ? '' : ' off') + '">' + badgeSvg(c, inner) + '<small>' + name + '</small></div>').join('') + '</div></div>' +
      '</div>' +
      (led ? '<details><summary>流水</summary><ul class="zmme-led">' + led + '</ul></details>' : '');
    const sp = $('zmmeSpark');
    const draw = () => { sp.innerHTML = sparkSvg(p.ledger, Math.max(200, sp.clientWidth), sp.clientHeight || 120) || '<div class="zmme-empty">打几局就有了</div>'; };
    draw();
    new ResizeObserver(draw).observe(sp);
    const ck = document.querySelector('[data-ck]');
    if (ck) ck.addEventListener('click', () => {
      ck.disabled = true;
      W.checkin().then(() => load()).catch(() => { ck.disabled = false; });
    });
    const lg = document.querySelector('[data-login]');
    if (lg) lg.addEventListener('click', openLogin);
  }
  function openLogin() { if (window.SiteAuth && SiteAuth.openLogin) SiteAuth.openLogin(); else location.href = '/account/'; }

  function load() {
    if (!W) { $('zmmeBody').innerHTML = '<div class="zmme-err">加载失败</div>'; return; }
    W.profile().then(render).catch(() => { $('zmmeBody').innerHTML = '<div class="zmme-card zmme-err">连不上服务器，稍后再试</div>'; });
  }
  load();
  let wasIn = W && W.loggedIn();
  if (window.SiteAuth && SiteAuth.onChange) SiteAuth.onChange(() => { const now = W.loggedIn(); if (now !== wasIn) { wasIn = now; load(); } });
  if (location.hash === '#login' && !(W && W.loggedIn())) setTimeout(openLogin, 400);
}
</script>
