name: Pages build check

# 每次推送到 main 时，用 GitHub Pages 同款的 jekyll-build-pages 试构建一次。
# 只验证能否构建成功，不部署（不干扰 Pages 自身的部署流程）。
# 失败会在 Actions 里显眼报红 + 邮件通知，避免类似 Gemfile 那种破坏构建的提交静默上线。

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Test Doudizhu rules and UI invariants
        run: |
          node scripts/generate-doudizhu-offline-manifest.mjs
          git diff --exit-code -- toolbox/doudizhu/offline-assets.json
          node --test tools/doudizhu/engine.test.mjs tools/doudizhu/ai-contract.test.mjs tools/doudizhu/online-security.test.mjs tools/doudizhu/gate5-contract.test.mjs tools/doudizhu/gate6-accessibility.test.mjs

      - name: Test Forest state, storage, and release contracts
        run: |
          node --test tests/forest-core.test.mjs tests/forest-storage.test.mjs tests/forest-cloud-sync.test.mjs tests/forest-ui-contract.test.mjs
          node --check assets/js/forest/app.js
          node --check assets/js/forest/core.js
          node --check assets/js/forest/storage.js
          node --check assets/js/forest/scenes.js
          node scripts/benchmark-forest.mjs
          node scripts/test-forest-release.mjs

      - name: Test Pinball core and table contracts
        run: |
          node --test tests/pinball-core.test.mjs tests/pinball-table-contract.test.mjs
          node scripts/sim-pinball-balance.mjs --runs=4

      - name: Test kitchen planner data and scheduler contracts
        run: |
          ruby scripts/validate_kitchen_planner.rb
          node --test scripts/kitchen-core.test.mjs scripts/kitchen-scheduler.test.mjs

      - name: Verify deterministic Guandan production bundle
        run: |
          npx --yes terser@5.43.1 assets/js/games/guandan.js --compress --mangle --comments false -o /tmp/guandan.min.js
          cmp /tmp/guandan.min.js assets/js/games/guandan.min.js
          node scripts/generate-guandan-offline-manifest.mjs
          git diff --exit-code -- toolbox/guandan/offline-assets.json

      - name: Guandan release contracts
        run: |
          node scripts/test-guandan-p0.mjs
          node scripts/test-guandan-network.mjs
          node scripts/test-guandan-release.mjs
          node scripts/test-guandan-differential.mjs --count=10000
          node scripts/test-guandan-ai.mjs

      - name: Trial build (mirrors GitHub Pages exactly)
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Test kitchen real-recipe combination matrix
        run: node scripts/kitchen-scheduler-matrix.mjs

  guandan-live-marker:
    if: github.ref == 'refs/heads/main'
    needs: build-check
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Wait for the production marker and API gate
        run: node scripts/test-guandan-live.mjs --wait
